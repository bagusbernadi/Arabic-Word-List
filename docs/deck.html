<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belajar Surah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--card:#F1F3F4;--line:#DADCE0;--ink:#202124;--mute:#5F6368;--blue:#4285F4;--red:#EA4335;--yel:#FBBC05;--grn:#34A853;--pri:#202124;--pri-ink:#ffffff;--link:#1A73E8;--pyc:#1A73E8;--ok:#188038;--ok-bg:#E6F4EA;--err:#C5221F;--err-bg:#FCE8E6;--mark:#FEEFC3;--hz:"Amiri","Noto Naskh Arabic","Traditional Arabic","Scheherazade New",serif;--font:Calibri,Carlito,"Segoe UI",Arial,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.hd{max-width:860px;margin:0 auto;padding:28px 20px 16px}
h1{margin:0;font:700 40px/1.15 var(--font);color:var(--ink)}
h1 .c0,h1 .c1,h1 .c2,h1 .c3{color:var(--ink)}
h1::after{content:"";display:block;width:72px;height:6px;border-radius:3px;background:linear-gradient(90deg,#4285F4 25%,#EA4335 0 50%,#FBBC05 0 75%,#34A853 0);margin-top:12px}
.wrap{max-width:860px;margin:0 auto;padding:8px 20px 48px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
#tc{border:2px solid var(--line);background:#ffffff;padding:4px 16px}
#tc.on{border-color:var(--blue);color:var(--blue)}
.tab{font:700 16px var(--font);background:var(--card);color:var(--mute);border:0;border-radius:999px;padding:6px 20px;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--blue);color:#ffffff}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bar{position:sticky;top:0;background:#ffffff;padding:14px 0 8px;z-index:2}
#q{width:100%;font:inherit;padding:11px 16px;border:2px solid var(--line);border-radius:12px;background:#ffffff;color:var(--ink)}
#q:focus{border-color:var(--blue);outline:none}
#q::placeholder{color:#80868B}
#info{color:var(--mute);font-size:15px;margin:8px 2px 0}
.card{background:var(--card);border-radius:16px;border-left:8px solid var(--blue);padding:16px 20px;margin-top:12px}
.card.cb{border-left-color:var(--blue)}.card.cr{border-left-color:var(--red)}.card.cy{border-left-color:var(--yel)}.card.cg{border-left-color:var(--grn)}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cats[hidden]{display:none}
.ct{font:700 15px var(--font);color:#ffffff;border:3px solid transparent;border-radius:999px;padding:6px 14px;cursor:pointer;background:var(--pri)}
.ct.b{background:var(--blue)}.ct.r{background:var(--red)}.ct.y{background:var(--yel);color:var(--ink)}.ct.g{background:var(--grn)}
.ct small{font-weight:400;opacity:.9;margin-left:4px}
.ct[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px #ffffff inset}
.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;background:#ffffff;border-radius:10px;padding:8px 14px}
.row+.row{margin-top:6px}
.id{font-size:18px;font-weight:400;color:var(--ink)}
.hz{font:700 24px/1.3 var(--hz);color:var(--ink)}
.py{color:var(--pyc);font-weight:700;font-size:16px}
.meta{color:var(--mute);font-size:15px;margin-top:8px}
.lb{display:inline-block;font:700 14px/1 var(--font);border-radius:999px;padding:5px 12px;margin-bottom:10px;color:#ffffff}
.lb.g{background:var(--grn)}
.lb.b{background:var(--blue)}
.lb.y{background:var(--yel);color:var(--ink)}
.lb.r{background:var(--red)}
button.cp{flex:none;border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;font:700 14px var(--font);cursor:pointer;min-width:76px}
button.cp:hover{background:var(--line)}
button.cp.ok{background:var(--ok-bg);color:var(--ok)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--mute);text-align:center;padding:40px 12px;font-size:16px}
.score{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:15px;margin-top:12px}
.pg{height:6px;background:var(--card);border-radius:999px;margin-top:10px;overflow:hidden}
#pgf{height:100%;width:0;background:linear-gradient(90deg,#4285F4,#34A853);border-radius:999px;transition:width .3s}
.ask{color:var(--mute);font-size:15px;font-weight:700}
.qt{margin:6px 0 0;word-break:break-word}
.qt.hz{font:700 34px/1.3 var(--hz);color:var(--ink)}
.qt.py{font:700 22px/1.4 var(--font);color:var(--pyc)}
.qt.id{font:400 22px/1.4 var(--font);color:var(--ink)}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;background:#ffffff;color:var(--ink);border:2px solid transparent;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--font);background:var(--card);color:var(--mute)}
.opt .t{word-break:break-word}
.opt.hz .t{font:700 22px/1.35 var(--hz);color:var(--ink)}
.opt.py .t{color:var(--pyc);font-weight:700}
.opt.ok{background:var(--ok-bg);border-color:var(--grn)}
.opt.ok .t{color:var(--ok)}
.opt.no{background:var(--err-bg);border-color:var(--red)}
.opt.no .t{color:var(--err)}
.opt:disabled{cursor:default}
.res{margin-top:14px;padding-top:14px;border-top:2px solid var(--line)}
.res .v{font-weight:700;margin-bottom:6px}
button.next{margin-top:14px;background:var(--blue);color:#ffffff;border:0;border-radius:999px;padding:9px 22px;font:700 16px var(--font);cursor:pointer}
button.next:hover{background:#1A73E8}
button.lnk{background:none;border:0;color:var(--link);cursor:pointer;font:inherit;font-size:15px;font-weight:700}
@media (max-width:480px){.hd,.wrap{padding-left:16px;padding-right:16px}h1{font-size:32px}.hz{font-size:22px}.qt.hz{font-size:30px}}
.exs{margin-top:12px;padding-top:12px;border-top:2px dashed var(--line)}
.exh{font:700 13px var(--font);color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.ex{padding:8px 14px;margin-top:6px;background:#ffffff;border-radius:10px}
.ex:last-child{padding-bottom:8px}
.ex-id{color:var(--ink);font-size:16px}
.ex-py{color:var(--pyc);font-size:15px;font-weight:700}
.ex-hz{color:var(--ink);font:700 18px/1.45 var(--hz)}
.id.tog{cursor:pointer;display:inline-block}
.id.tog::after{content:" \25BE";color:#80868B;font-size:13px}
.id.tog.open::after{content:" \25B4"}
.id.tog:hover{color:var(--link)}
.exs[hidden]{display:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;color:var(--mute);margin-top:14px}
.legend b{font-weight:700}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mode{text-align:left;background:var(--card);color:var(--ink);border:2px solid transparent;border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.mode b{font:700 15px var(--font);color:var(--mute)}
.mode span{font-size:14px;line-height:1.3}
.mode[aria-pressed="true"]{background:#E8F0FE;border-color:var(--blue)}
.mode[aria-pressed="true"] b{color:var(--blue)}
.opt.ap .t{display:flex;flex-direction:column}
.opt .oh{font:700 22px/1.35 var(--hz);color:var(--ink)}
.opt .oy{color:var(--pyc);font-weight:700;font-size:15px}
.opt.ok .oh,.opt.ok .oy{color:var(--ok)}.opt.no .oh,.opt.no .oy{color:var(--err)}
.opt.id .t{font-size:17px}
.ow{display:flex;gap:8px;align-items:stretch}
.ow .opt{flex:1;min-width:0}
button.sp.lg{width:46px;height:auto;border-radius:10px;background:#ffffff}
button.sp.lg.on{background:var(--blue)}
.opt .oi{margin-left:auto;text-align:right;font-size:14px;line-height:1.3;color:var(--mute);max-width:42%;word-break:break-word}
.opt.ok .oi{color:var(--ok)}.opt.no .oi{color:var(--err)}
.wd{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.w{background:#ffffff;border-radius:10px;padding:6px 12px;text-align:center}
.wh{font:700 28px/1.3 var(--hz);color:var(--ink)}
.wp{color:var(--pyc);font-weight:700;font-size:15px}
@media (max-width:560px){.modes{grid-template-columns:1fr}.mode{flex-direction:row;align-items:center;gap:10px}}
button.sp{flex:none;width:38px;height:34px;border:0;border-radius:999px;background:var(--card);color:var(--blue);cursor:pointer;display:inline-grid;place-items:center;padding:0}
button.sp.on{background:var(--blue);color:#ffffff}
.bt{display:flex;gap:6px;align-items:center;flex:none}
.exr{display:flex;gap:8px;align-items:center;justify-content:space-between}
.rh{display:flex;gap:10px;align-items:center;justify-content:space-between}
a.tab{text-decoration:none;display:inline-block}
.pm{position:fixed;inset:0;z-index:50;background:rgba(32,33,36,.25);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px}
.pm[hidden]{display:none}
.pmc{width:100%;max-width:560px;max-height:85vh;display:flex;flex-direction:column;background:rgba(255,255,255,.68);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.7);border-radius:24px;box-shadow:0 10px 40px rgba(32,33,36,.22);overflow:hidden}
.pmh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 10px}
.pmh h2{font:700 20px var(--font);margin:0;color:var(--ink)}
.pmh h2:after{content:"";display:block;width:64px;height:4px;margin-top:6px;border-radius:2px;background:linear-gradient(90deg,var(--blue) 25%,var(--red) 25% 50%,var(--yel) 50% 75%,var(--grn) 75%)}
#pmx{border:0;background:rgba(241,243,244,.8);color:var(--mute);width:36px;height:36px;border-radius:999px;font-size:16px;cursor:pointer}
.pmb{overflow:auto;padding:0 18px 18px;-webkit-overflow-scrolling:touch}
.gs{--c:var(--blue)}.gs.r{--c:var(--red)}.gs.y{--c:var(--yel)}.gs.g{--c:var(--grn)}
.gs h2{display:inline-block;background:var(--c);color:#fff;border-radius:999px;padding:5px 16px;font:700 15px var(--font);margin:0 0 6px}
.gs.y h2{color:var(--ink)}
.gi{border-left:6px solid var(--c);background:rgba(241,243,244,.72)!important;border-radius:14px!important}
.pm button.sp{background:rgba(255,255,255,.85)}.pm button.sp.on{background:var(--blue)}
#t3{margin-left:auto;padding:6px 12px;display:inline-grid;place-items:center}
.gs{margin-top:16px}.gs .gd{color:var(--mute);font-size:15px;margin:0 0 8px}
.gi{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:8px 12px;margin-top:6px}
.gi .gp{font-weight:700;color:var(--pyc);min-width:76px;font-size:17px}.gi .gh{font:700 24px/1.2 var(--hz);min-width:auto}
.gi.gn .gp{min-width:76px;max-width:110px;overflow-wrap:anywhere}.gi.gn{padding-top:10px;padding-bottom:10px}
.gi .gt{flex:1;font-size:15px;line-height:1.35;color:var(--ink)}
@media (max-width:400px){.tab{font-size:14px;padding:6px 11px}.tabs{gap:4px}#tc{padding:4px 8px!important;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
.ar{font:400 30px/1.9 var(--hz);direction:rtl;text-align:right;color:var(--ink);unicode-bidi:isolate}
.ar.sm{font-size:26px}
.tl{color:var(--pyc);font-weight:700;font-size:16px;margin-top:2px}
.row.ra{align-items:center}
.row.ra>div:first-child{flex:1;min-width:0}
.subs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sub{font:700 14px var(--font);background:var(--card);color:var(--mute);border:2px solid transparent;border-radius:999px;padding:5px 14px;cursor:pointer}
.sub small{font-weight:400;margin-left:4px}
.sub[aria-pressed="true"]{background:#E8F0FE;color:var(--blue);border-color:var(--blue)}
.cek{color:#B06000;font-weight:700}
.ref{display:inline-block;font:700 13px var(--font);background:#ffffff;border-radius:999px;padding:3px 10px;color:var(--mute);margin-left:6px}
.sbtn{font:700 14px var(--font);color:#ffffff;border:3px solid transparent;border-radius:999px;padding:5px 12px;cursor:pointer;background:var(--blue)}
.sbtn.g{background:var(--grn)}
.sbtn[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px #ffffff inset}
.sbtn small{font-weight:400;opacity:.9;margin-left:4px}
.qt.ar{font-size:40px;line-height:1.7;margin:6px 0 0}
.opt.ap .t{display:flex;flex-direction:column}
.opt .oa{font:400 28px/1.7 var(--hz);direction:rtl;text-align:right;color:var(--ink)}
.opt.ar-o .t{width:100%}
.opt.ok .oa{color:var(--ok)}.opt.no .oa{color:var(--err)}
.foot{max-width:860px;margin:0 auto;padding:8px 20px 40px;color:var(--mute);font-size:13px;line-height:1.5}
.foot a{color:var(--link)}
.gs p{font-size:15px;margin:6px 0}
.gs ul{margin:6px 0 6px 18px;padding:0;font-size:15px}
.gs code{background:rgba(241,243,244,.9);border-radius:6px;padding:1px 6px}
</style>
<style>
[hidden]{display:none!important}
#tp{border:2px solid var(--line);background:#ffffff;padding:4px 16px}
#cats,#pcats{margin-top:10px}
#pcats{max-height:200px;overflow:auto;padding:2px}
@media (max-width:400px){#tp{padding:4px 8px!important;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
#xmx{border:0;background:rgba(241,243,244,.8);color:var(--mute);width:36px;height:36px;border-radius:999px;font-size:16px;cursor:pointer}
.xk{display:block;margin:0 0 6px;color:var(--mute);font-size:15px}
#quiz{touch-action:pan-y}@keyframes slL{from{opacity:.2;transform:translateX(40px)}to{opacity:1;transform:none}}@keyframes slR{from{opacity:.2;transform:translateX(-40px)}to{opacity:1;transform:none}}#quiz.sl{animation:slL .25s ease-out}#quiz.sr{animation:slR .25s ease-out}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}.acts .next,.acts button.alt2{margin-top:0}
button.alt2{background:#ffffff;color:var(--blue);border:0;border-radius:999px;padding:9px 22px;font:700 16px var(--font);cursor:pointer}
.dinfo{margin-top:14px;font-size:17px}
.dinfo small{display:block;color:var(--mute);font-size:15px}
.exg{display:flex;flex-direction:column;gap:6px;background:rgba(241,243,244,.72);border-left:6px solid var(--blue);border-radius:14px;padding:10px 12px;margin-top:8px}
.exg .tl{font-size:15px}.exg .xi{color:var(--ink);font-size:15px}
</style>
</head>
<body>
<header class="hd"><h1>Belajar Surah</h1></header>
<div class="wrap">
<div class="tabs"><a class="tab" href="index.html">Kamus</a><a class="tab" aria-selected="true" aria-current="page" href="deck.html">Belajar Surah</a><button class="tab on" type="button" id="tc" aria-expanded="false" aria-controls="cats">Surah ▾</button><button class="tab" type="button" id="tp" aria-expanded="false" aria-controls="pcats" hidden>Bagian ▾</button><button class="tab" type="button" id="t3" aria-haspopup="dialog" aria-expanded="false" aria-label="Panduan dan sumber data" title="Panduan dan sumber data"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg></button></div>
<div class="cats" id="cats" role="group" aria-label="Pilih surah" hidden></div>
<div class="cats" id="pcats" role="group" aria-label="Pilih bagian" hidden></div>
<div class="dinfo" id="dinfo"></div>
<div class="score"><span id="sc"></span><button class="lnk" id="rs" type="button">Ulangi bagian ini</button></div>
<div class="pg"><div id="pgf"></div></div>
<div class="card" id="quiz">Memuat soal…</div>
</div>
<div class="pm" id="pm" role="dialog" aria-modal="true" aria-labelledby="pmt" hidden>
<div class="pmc"><div class="pmh"><h2 id="pmt">Panduan dan sumber data</h2><button type="button" id="pmx" aria-label="Tutup">✕</button></div><div class="pmb" id="pmb"></div></div>
</div>
<div class="pm" id="xm" role="dialog" aria-modal="true" aria-labelledby="xmt" hidden>
<div class="pmc"><div class="pmh"><h2 id="xmt">Contoh ayat</h2><button type="button" id="xmx" aria-label="Tutup">✕</button></div><div class="pmb" id="xmb"></div></div>
</div>

function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function same(a,b){return norm(a).replace(/\s+/g,"")===norm(b).replace(/\s+/g,"")}
function letters(s){var o={};norm(s).replace(/[ء-ي]/g,function(c){o[c]=1});return o}
function jac(a,b){var i=0,u=0,k;for(k in a){u++;if(b[k])i++}for(k in b)if(!a[k])u++;return u?i/u:0}
function wtoks(s){var o={};norm(s).split(/[^a-z0-9]+/).forEach(function(w){if(w.length>2)o[w]=1});return o}
function sim(q,d){
  var s=jac(letters(q.a),letters(d.a))*5+jac(wtoks(q.i),wtoks(d.i))*3+Math.max(0,1-Math.abs(q.a.length-d.a.length)/8);
  return s+Math.random()*.8;
}
function sname(s){var o=SURAH[s-1];return o?o.n+". "+o.name:String(s)}
function scol(s){var o=SURAH[s-1];return o&&/madin/i.test(o.type)?"g":"b"}

var ALL=[],BY={},cur={s:1,p:1},deck=[],rec=[],st={ok:0,all:0},total=0,vi=0,POOLS=[];
function partsOf(s){
  var L=BY[s]||[],k=Math.max(1,Math.ceil(L.length/PART)),sz=Math.ceil(L.length/k),out=[];
  for(var i=0;i<k;i++){var c=L.slice(i*sz,(i+1)*sz);if(c.length)out.push(c)}
  return out;
}
/* pilihan jawaban: dari bagian yang sama; bila kurang dari 4, dilengkapi kata mirip dari surah lain */
function pickOpts(q,pool){
  var seen=[q],opts=[q];
  function ok(c){return c!==q&&!seen.some(function(s){return same(s.i,c.i)||norm(s.a)===norm(c.a)||s.t===c.t})}
  var base=pool.filter(ok).map(function(d){return[sim(q,d),d]}).sort(function(a,b){return b[0]-a[0]}).map(function(x){return x[1]});
  for(var i=0;i<base.length&&opts.length<4;i++){if(ok(base[i])){opts.push(base[i]);seen.push(base[i])}}
  if(opts.length<4){
    var extra=shuf(ALL).slice(0,1500).filter(ok).map(function(d){return[sim(q,d),d]}).sort(function(a,b){return b[0]-a[0]}).map(function(x){return x[1]});
    for(var j=0;j<extra.length&&opts.length<4;j++){if(ok(extra[j])){opts.push(extra[j]);seen.push(extra[j])}}
  }
  return shuf(opts);
}
function score(n){$("sc").textContent=(n>total?"Selesai":"Soal "+n+" dari "+total)+" · Benar "+st.ok;$("pgf").style.width=Math.min(st.all,total)/total*100+"%"}
